name: Refresh Market Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-market.yml'
      - 'scripts/build-market.mjs'
  schedule:
    - cron: '15 14-22 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build market data
        run: node scripts/build-market.mjs
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh market data [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
